[package]
name = "gpui-jsx-macros"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Minimal JSX-like proc macro that expands to GPUI fluent builder calls"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
